<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Танчики</title>
<style>
:root{--ac:#6ea8ff;--bg:#080a12;--card:#11141fcc;--ln:#ffffff1a;--tx:#e9ecf5;--dim:#8d96ad}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px 'Trebuchet MS','Segoe UI',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:12px;overflow:auto}
.scr.on{display:flex}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:16px;padding:22px;box-shadow:0 20px 60px #0008,0 0 40px color-mix(in srgb,var(--ac) 18%,transparent)}
h1{margin:0 0 4px;font-size:44px;letter-spacing:2px;text-shadow:0 0 24px var(--ac)}
h2,h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--dim)}
input{background:#05070d;border:1px solid var(--ln);border-radius:10px;color:inherit;padding:11px;font:inherit;width:100%;text-align:center;outline:none}
input:focus{border-color:var(--ac)}
button{background:var(--ac);border:0;border-radius:10px;color:#05070d;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,filter .12s}
button:hover{filter:brightness(1.15);transform:translateY(-1px)}
button.alt{background:#ffffff14;color:var(--tx)}
button:focus-visible,.ab:focus-visible,.th:focus-visible{outline:2px solid #fff;outline-offset:2px}
.small{color:var(--dim);font-size:13px}
.row{display:flex;gap:8px}
#menu .card{width:340px;text-align:center}
.lb{width:min(1080px,100%);display:flex;flex-direction:column;gap:14px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.code{font-size:44px;font-weight:800;letter-spacing:10px;line-height:1;text-shadow:0 0 20px var(--ac)}
.cols{display:grid;grid-template-columns:240px 1fr 220px;gap:14px}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.pl{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;background:#ffffff08;margin-bottom:5px}
.pl i,.r i{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.pl b{margin-left:auto;font-weight:400}
.abg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ab,.th{background:#ffffff0a;border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:left;color:var(--tx);font-weight:400;cursor:pointer}
.ab.sel,.th.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--ac) 35%,transparent)}
.ab b,.th b{display:block;font-size:14px}
.ab span{font-size:12px;color:var(--dim)}
.ab em{font-style:normal;font-size:11px;color:var(--ac)}
.th{display:block;width:100%;margin-bottom:6px;padding:8px 10px}
.th.dis{opacity:.55;cursor:default}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#roster{position:absolute;top:10px;right:10px;background:#080a12aa;border:1px solid var(--ln);border-radius:10px;padding:6px 10px;font-size:13px}
.r{display:flex;align-items:center;gap:6px;padding:2px 0}
.r small{margin-left:auto;padding-left:10px}
.r.dead span{text-decoration:line-through;opacity:.45}
.r.dead small,.r.dead i{opacity:.3}
#feed{position:absolute;top:10px;left:10px;font-size:13px}
#feed div{background:#080a12aa;border-left:4px solid #888;padding:3px 8px;margin-bottom:3px;border-radius:4px}
#status{position:absolute;bottom:70px;left:0;right:0;text-align:center;color:#ffd740;font-size:16px;text-shadow:0 0 10px #000}
#abhud{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:#080a12bb;border:1px solid var(--ln);border-radius:12px;padding:8px 14px}
#abhud .ic{font-size:26px}
#abbar{width:120px;height:6px;background:#ffffff1a;border-radius:3px;overflow:hidden}
#abfill{height:100%;background:var(--ac);width:100%}
.res{display:flex;gap:10px;padding:5px 0;align-items:center;text-align:left}
.res b{width:26px}.res span{flex:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="feed"></div><div id="roster"></div><div id="status"></div>
  <div id="abhud"><span class="ic" id="abic"></span><div><div id="abn"></div><div id="abbar"><div id="abfill"></div></div></div></div>
</div>

<div id="menu" class="scr on"><div class="card">
  <h1>ТАНЧИКИ</h1>
  <div class="small" style="margin-bottom:18px">Бои до 10 игроков в браузере</div>
  <input id="name" maxlength="12" placeholder="Твой ник" style="margin-bottom:10px">
  <button id="create" style="width:100%">Создать комнату</button>
  <div class="small" style="margin:12px 0">или войти по коду</div>
  <div class="row"><input id="code" maxlength="4" placeholder="КОД" style="text-transform:uppercase"><button id="join">Войти</button></div>
</div></div>

<div id="lobby" class="scr"><div class="lb">
  <div class="card hd">
    <div><div class="small">Код комнаты</div><div class="code" id="lcode"></div></div>
    <div class="small" style="max-width:340px">WASD — движение · мышь — прицел · ЛКМ — огонь · Shift/Пробел/ПКМ — умение · M — звук</div>
    <button class="alt" id="copy">Скопировать ссылку для друзей</button>
  </div>
  <div class="cols">
    <div class="card"><h3>Игроки <span id="cnt"></span></h3><div id="lpl"></div></div>
    <div class="card"><h3>Выбери способность</h3><div class="abg" id="abg"></div></div>
    <div class="card"><h3>Карта</h3><div id="thg"></div><div class="small" id="thhint"></div></div>
  </div>
  <div class="card" style="text-align:center">
    <button id="startBtn" style="font-size:17px;padding:13px 40px">▶ Начать игру</button>
    <div class="small" id="waitTxt">Ждём, пока командир начнёт игру…</div>
  </div>
</div></div>

<div id="results" class="scr"><div class="card" style="min-width:340px">
  <h2 id="rtitle" style="font-size:22px;color:var(--tx)"></h2>
  <div id="rlist"></div>
  <div style="margin-top:14px;text-align:center">
    <span id="rhost"><button id="again">▶ Новый матч</button> <button class="alt" id="tolobby">В лобби</button></span>
    <div class="small" id="rwait">Ждём решения командира…</div>
  </div>
</div></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const COLORS = ['#ff5252','#40c4ff','#69f0ae','#ffd740','#e040fb','#ff9100','#00e5ff','#b2ff59','#ff80ab','#b39ddb'];
const W = 1600, H = 880, CELL = 40, COLS = 40, ROWS = 22, N = COLS * ROWS, R = 14;
// [иконка, название, описание, активная]
const ABS = {
  ricochet: ['🔁','Рикошет','Снаряды отскакивают от стен',0], triple: ['🔱','Тройной залп','Веер из трёх снарядов',0],
  vampire: ['🧛','Вампиризм','Урон по врагам лечит вас',0], regen: ['💚','Регенерация','HP восстанавливается сам',0],
  armor: ['🛡️','Броня','−28% входящего урона',0], rapid: ['⚡','Скорострел','Частые, но слабые выстрелы',0],
  pierce: ['🎯','Пробой','Снаряд пробивает цель насквозь',0], dash: ['💨','Рывок','Мгновенный бросок вперёд',1],
  shield: ['🔮','Щит','2 секунды неуязвимости',1], mine: ['💣','Мина','Ставит скрытую мину',1],
};
const ABK = Object.keys(ABS);
const TH = {
  dawn:{n:'Утро',e:'🌅',fl:'#24323f',f2:'#293a4b',wl:'#7d8ba0',wt:'#a9b6c9',cr:'#c58f5a',wa:'#3c7fa8',wh:'#9fdcf5',bu:'#5fae6a',am:'#ffe9d2',ac:'#ffb27a',pk:2,pc:'#ffe2c4',root:220,sc:[0,2,4,7,9]},
  night:{n:'Ночь',e:'🌙',fl:'#0b1020',f2:'#0e1527',wl:'#2b3658',wt:'#3d4c7a',cr:'#6b5a46',wa:'#0f3b78',wh:'#4f9bff',bu:'#164a36',am:'#334270',ac:'#6ea8ff',pk:0,pc:'#e6ff8a',root:196,sc:[0,3,5,7,10]},
  acid:{n:'Кислотные шахты',e:'☣️',fl:'#0e150d',f2:'#121b10',wl:'#3a2a58',wt:'#5a3f88',cr:'#6f6a3a',wa:'#4fbf1a',wh:'#c6ff5a',bu:'#2e7a2a',am:'#6f9b5c',ac:'#b6ff3b',pk:1,pc:'#c6ff5a',root:174,sc:[0,1,5,7,8],wg:1},
  dune:{n:'Закат',e:'🏜️',fl:'#3a2327',f2:'#432a2c',wl:'#a2583b',wt:'#c9764d',cr:'#8a6a3a',wa:'#2b7f8f',wh:'#7fe0ea',bu:'#7d8a33',am:'#ffc196',ac:'#ff6a3d',pk:2,pc:'#ffb27a',root:196,sc:[0,3,5,7,10]},
  neon:{n:'Неон',e:'🌃',fl:'#0a0617',f2:'#0d081e',wl:'#2b1856',wt:'#4a2a8f',cr:'#7a2a6a',wa:'#00a7c9',wh:'#5ffbff',bu:'#c4207a',am:'#6a54c4',ac:'#ff2bd6',pk:1,pc:'#ff7be8',root:220,sc:[0,3,5,7,10],wg:1,grid:1},
};
const TK = Object.keys(TH);

let ws, me = 0, room = '', host = 0, lobbyPl = [], lobbyTh = 'auto';
let info = new Map(), grid = new Uint8Array(N), tanks = new Map(), bullets = [], pks = [], mines = [], zone = [0,0,W,H];
let dead = new Set(), cd = 0, phase = 'menu', theme = 'night', snapT = 0, myAc = 0, dirty = false;
let wc = [], bc = [];

// ---------- экраны ----------
function show(name) {
  phase = name;
  for (const id of ['menu','lobby','results']) $(id).classList.toggle('on', id === name);
  $('hud').style.display = name === 'game' ? 'block' : 'none';
  cv.style.cursor = name === 'game' ? 'none' : 'default';
  setAccent();
}
function setAccent() { document.documentElement.style.setProperty('--ac', TH[theme].ac); }
function updateHostUI() {
  const h = me === host;
  $('startBtn').style.display = h ? '' : 'none'; $('waitTxt').style.display = h ? 'none' : '';
  $('rhost').style.display = h ? '' : 'none'; $('rwait').style.display = h ? 'none' : '';
}
function dot(c) { const i = document.createElement('i'); i.style.background = i.style.color = COLORS[c]; return i; }

const abg = $('abg');
for (const k of ABK) {
  const a = ABS[k], b = document.createElement('button'); b.className = 'ab'; b.dataset.k = k;
  b.innerHTML = '<b>' + a[0] + ' ' + a[1] + '</b><span>' + a[2] + '</span>' + (a[3] ? '<br><em>Shift / Пробел / ПКМ</em>' : '');
  b.onclick = () => tx({ t: 'pick', ab: k }); abg.append(b);
}
const thg = $('thg');
for (const k of ['auto', ...TK]) {
  const b = document.createElement('button'); b.className = 'th'; b.dataset.k = k;
  b.innerHTML = '<b>' + (k === 'auto' ? '🎲 Случайная' : TH[k].e + ' ' + TH[k].n) + '</b>';
  b.onclick = () => { if (me === host) tx({ t: 'cfg', th: k }); }; thg.append(b);
}

function renderLobby() {
  $('lcode').textContent = room; $('cnt').textContent = lobbyPl.length + '/10';
  const el = $('lpl'); el.textContent = '';
  for (const p of lobbyPl) {
    const d = document.createElement('div'); d.className = 'pl';
    const s = document.createElement('span'); s.textContent = p.n + (p.id === me ? ' (вы)' : '') + (p.id === host ? ' 👑' : '');
    const b = document.createElement('b'); b.textContent = ABS[p.ab] ? ABS[p.ab][0] : '';
    d.append(dot(p.c), s, b); el.append(d);
  }
  const mine = lobbyPl.find(p => p.id === me);
  for (const b of abg.children) b.classList.toggle('sel', !!mine && b.dataset.k === mine.ab);
  for (const b of thg.children) { b.classList.toggle('sel', b.dataset.k === lobbyTh); b.classList.toggle('dis', me !== host); }
  $('thhint').textContent = me === host ? 'Карту выбирает командир' : 'Карту выбирает командир 👑';
  theme = lobbyTh === 'auto' ? theme : lobbyTh; setAccent();
  updateHostUI();
}
function renderRoster() {
  const el = $('roster'); el.textContent = '';
  for (const p of info.values()) {
    const d = document.createElement('div'); d.className = 'r' + (dead.has(p.id) ? ' dead' : '');
    const s = document.createElement('span'); s.textContent = p.n + (p.id === me ? ' (вы)' : '');
    const a = document.createElement('small'); a.textContent = ABS[p.ab] ? ABS[p.ab][0] : '';
    d.append(dot(p.c), s, a); el.append(d);
  }
  $('status').textContent = dead.has(me) ? 'Вы выбыли. Ждём победителя…' : '';
}
function addFeed(k, v) {
  const vi = info.get(v), ki = info.get(k), vn = vi ? vi.n : '?', d = document.createElement('div');
  if (k == null) d.textContent = vn + ' отключился';
  else if (k === 0) { d.textContent = vn + ' погиб в шторме'; d.style.borderColor = '#ff4060'; }
  else if (k === v) { d.textContent = vn + ' подорвал сам себя'; if (vi) d.style.borderColor = COLORS[vi.c]; }
  else { d.textContent = (ki ? ki.n : '?') + ' уничтожил ' + vn; if (ki) d.style.borderColor = COLORS[ki.c]; }
  const f = $('feed'); f.append(d);
  while (f.children.length > 6) f.firstChild.remove();
  setTimeout(() => d.remove(), 6000);
}

// ---------- сеть ----------
function connect(first) {
  if (ws) { ws.onclose = null; ws.close(); }
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => ws.send(JSON.stringify(first));
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { if (phase !== 'menu') { alert('Соединение потеряно'); show('menu'); } };
}
const tx = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

function handle(m) {
  switch (m.t) {
    case 'err': alert(m.m); show('menu'); break;
    case 'joined': me = m.id; room = m.room; history.replaceState(null, '', '?room=' + room); show('lobby'); break;
    case 'lobby':
      lobbyPl = m.pl; host = m.host; lobbyTh = m.th; renderLobby();
      if (m.ph === 'lobby' && phase !== 'lobby') show('lobby');
      break;
    case 'start':
      info = new Map(m.pl.map(p => [p.id, p])); theme = m.theme;
      grid = Uint8Array.from(m.grid, c => +c); dirty = true;
      tanks.clear(); bullets = []; pks = []; mines = []; zone = [0,0,W,H]; pt.length = 0; fx.length = 0; dead.clear(); $('feed').textContent = '';
      lastK = -1; km = mm = 0;
      const mi = info.get(me);
      if (mi) { const a = ABS[mi.ab]; $('abic').textContent = a[0]; $('abn').textContent = a[1]; $('abhud').style.display = 'flex'; $('abbar').style.display = a[3] ? '' : 'none'; $('abn').title = ''; }
      else $('abhud').style.display = 'none';
      renderRoster(); show('game'); break;
    case 's': applySnap(m); break;
    case 'feed': dead.add(m.v); addFeed(m.k, m.v); renderRoster(); if (m.v === me) flash = 1; break;
    case 'over': showResults(m); break;
  }
}

function applySnap(m) {
  cd = m.cd; snapT = performance.now();
  const seen = new Set();
  for (const [id, x, y, a, hp, fl, ac] of m.p) {
    seen.add(id);
    let t = tanks.get(id);
    if (!t) { t = { x, y, a, px: x, py: y }; tanks.set(id, t); }
    t.tx = x; t.ty = y; t.ta = a; t.hp = hp; t.fl = fl;
    if (id === me) myAc = ac;
  }
  for (const id of tanks.keys()) if (!seen.has(id)) tanks.delete(id);
  bullets = m.b.map(b => ({ x: b[0], y: b[1], o: b[2], vx: b[3], vy: b[4] }));
  pks = m.pk; mines = m.mn; zone = m.z;
  if (m.tl) { for (const [i, v] of m.tl) grid[i] = v; dirty = true; }
  $('abfill').style.width = (1 - myAc) * 100 + '%';
  if (zone[0] > 2 && !dead.has(me)) $('status').textContent = '⚠ Шторм сужает арену!';
  if (m.e) for (const e of m.e) fxEvent(e);
}

function showResults(m) {
  $('rtitle').textContent = m.winner ? '🏆 Победитель: ' + info.get(m.winner).n : 'Ничья';
  const el = $('rlist'); el.textContent = '';
  m.rank.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'res';
    const b = document.createElement('b'); b.textContent = (i + 1) + '.';
    const s = document.createElement('span'); s.textContent = p.n + ' ' + (ABS[p.ab] ? ABS[p.ab][0] : '');
    const k = document.createElement('small'); k.textContent = 'убийств: ' + p.k;
    d.append(b, dot(p.c), s, k); el.append(d);
  });
  updateHostUI(); show('results');
}

// ---------- кнопки ----------
$('name').value = localStorage.getItem('tn') || '';
$('code').value = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
const nick = () => { const n = $('name').value.trim(); try { localStorage.setItem('tn', n); } catch {} return n; };
$('create').onclick = () => { initA(); connect({ t: 'join', name: nick() }); };
$('join').onclick = () => { const c = $('code').value.trim(); if (c) { initA(); connect({ t: 'join', name: nick(), room: c }); } };
$('copy').onclick = () => {
  navigator.clipboard.writeText(location.origin + '/?room=' + room).then(() => { $('copy').textContent = 'Скопировано ✔'; setTimeout(() => $('copy').textContent = 'Скопировать ссылку для друзей', 1500); });
};
$('startBtn').onclick = () => tx({ t: 'start' });
$('again').onclick = () => tx({ t: 'start' });
$('tolobby').onclick = () => tx({ t: 'again' });

// ---------- управление: WASD + мышь ----------
const KEYS = { KeyW: 1, KeyS: 2, KeyA: 4, KeyD: 8, Space: 128, ShiftLeft: 128, ShiftRight: 128 };
let km = 0, mm = 0, mx = W / 2, my = H / 2, lastK = -1, lastA = 0, lastS = 0, muted = false;
function setKey(e, down) {
  if (e.code === 'KeyM' && down && e.target.tagName !== 'INPUT') { muted = !muted; return; }
  const b = KEYS[e.code];
  if (!b || phase !== 'game') return;
  e.preventDefault(); km = down ? km | b : km & ~b;
}
addEventListener('keydown', e => { initA(); setKey(e, true); });
addEventListener('keyup', e => setKey(e, false));
addEventListener('blur', () => { km = mm = 0; });
addEventListener('mousemove', e => { mx = (e.clientX * DPR - OX) / S; my = (e.clientY * DPR - OY) / S; });
addEventListener('mousedown', e => { initA(); if (phase !== 'game') return; if (e.button === 0) mm |= 64; else if (e.button === 2) mm |= 128; });
addEventListener('mouseup', e => { if (e.button === 0) mm &= ~64; else if (e.button === 2) mm &= ~128; });
addEventListener('contextmenu', e => { if (phase === 'game') e.preventDefault(); });

// ---------- звук (WebAudio: тон + фильтрованный шум + генеративная музыка) ----------
let ac, mg, nbuf; const lastSnd = {};
function initA() {
  if (ac) { ac.resume(); return; }
  ac = new AudioContext(); mg = ac.createGain(); mg.gain.value = .7;
  const c = ac.createDynamicsCompressor(); mg.connect(c); c.connect(ac.destination);
  nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  setInterval(music, 150);
}
function out(pan) { if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(mg); return p; } return mg; }
function tone(f1, f2, d, type, v, pan = 0, dl = 0) {
  const t = ac.currentTime + dl, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g); g.connect(out(pan)); o.start(t); o.stop(t + d + .02);
}
function noise(d, f1, f2, v, pan = 0, type = 'lowpass') {
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = nbuf; f.type = type; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  s.connect(f); f.connect(g); g.connect(out(pan)); s.start(t); s.stop(t + d);
}
function sfx(type, x) {
  if (muted || !ac) return;
  const n = performance.now(); if (n - (lastSnd[type] || 0) < 35) return; lastSnd[type] = n;
  const p = Math.max(-1, Math.min(1, x / W * 2 - 1)) * .8;
  switch (type) {
    case 0: tone(560, 90, .16, 'sawtooth', .11, p); noise(.06, 5000, 1500, .08, p, 'highpass'); break;
    case 1: noise(.13, 3500, 500, .22, p); tone(200, 60, .1, 'square', .08, p); break;

}
let mstep = 0, mNote = 0;
function music() {

const rndI = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

// ---------- частицы, эффекты ----------
const pt = [], fx = [];

}
function fxEvent([type, x, y, q]) {
  sfx(type, x);
  const T = TH[theme];
  switch (type) {
    case 0: burst(x, y, 4, '#fff', 120, .2, 2); break;
    case 1: burst(x, y, 10, '#fff', 220, .35, 2.5); shake = Math.max(shake, 3); break;
    case 2: burst(x, y, 40, '#ffb74d', 320, .9, 4); burst(x, y, 20, '#ff5252', 200, .8, 5); fx.push({ x, y, t: 0, d: .6, r: 70, c: '#ffb74d' }); shake = Math.max(shake, 12); break;
    case 3: burst(x, y, 4, '#ffe9a8', 140, .25, 2); break;
    case 4: burst(x, y, 12, T.cr, 200, .6, 4); break;
    case 5: case 8: burst(x, y, 36, '#ff9100', 360, .8, 4); fx.push({ x, y, t: 0, d: .55, r: type === 5 ? 90 : 80, c: '#ff7a2a' }); shake = Math.max(shake, 10); break;
    case 6: burst(x, y, 14, ['#69f0ae', '#40c4ff', '#ff5252'][q], 160, .6, 3); fx.push({ x, y, t: 0, d: .4, r: 30, c: '#fff' }); break;
    case 7: burst(x, y, 14, '#bfe8ff', 220, .35, 3); break;
    case 9: fx.push({ x, y, t: 0, d: .35, r: 30, c: '#6ee7ff' }); break;

// ---------- рендер ----------
const cv = $('cv'), ctx = cv.getContext('2d');

const [terr, tc] = mk(W, H), [lcv, lc] = mk(W / 4, H / 4), [sm1, s1] = mk(400, 220), [sm2, s2] = mk(100, 55);
const [vgc, vg] = mk(W, H), [scc, sc] = mk(4, 3), [nzc, nz] = mk(128, 128);
{ const g = vg.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, W * .62); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.68)'); vg.fillStyle = g; vg.fillRect(0, 0, W, H);

  const im = nz.createImageData(128, 128); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } nz.putImageData(im, 0, 0); }

const blobs = new Map();

}
const lt = (x, y, r, c, a) => { lc.globalAlpha = a; lc.drawImage(blob(c), (x - r) / 4, (y - r) / 4, r / 2, r / 2); };

let S = 1, OX = 0, OY = 0, DPR = 1;
function resize() {

  S = Math.min(cv.width / W, cv.height / H); OX = (cv.width - W * S) / 2; OY = (cv.height - H * S) / 2;
}
addEventListener('resize', resize); resize();

function paint() { // статичный слой ландшафта (перерисовывается при разрушении)
  const T = TH[theme], c = tc; dirty = false; wc = []; bc = [];
  c.fillStyle = T.fl; c.fillRect(0, 0, W, H);
  c.fillStyle = T.f2; for (let i = 0; i < N; i++) if ((((i % COLS) + ((i / COLS) | 0)) & 1)) c.fillRect((i % COLS) * CELL, ((i / COLS) | 0) * CELL, CELL, CELL);
  if (T.grid) { c.strokeStyle = '#ff2bd633'; c.lineWidth = 1; c.beginPath(); for (let x = 0; x <= W; x += CELL) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = 0; y <= H; y += CELL) { c.moveTo(0, y); c.lineTo(W, y); } c.stroke(); }
  c.fillStyle = 'rgba(0,0,0,.38)';
  for (let i = 0; i < N; i++) { const v = grid[i]; if (v === 1 || v === 2 || v === 5) c.fillRect((i % COLS) * CELL + 4, ((i / COLS) | 0) * CELL + 7, CELL, CELL); }

    if (v === 1) { c.fillStyle = T.wl; c.fillRect(x, y, CELL, CELL); c.fillStyle = T.wt; c.fillRect(x + 2, y + 2, CELL - 4, CELL - 9); c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(x + 2, y + 2, CELL - 4, 3); }
    else if (v === 2) { c.fillStyle = T.cr; c.fillRect(x + 3, y + 3, CELL - 6, CELL - 6); c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 2; c.strokeRect(x + 4, y + 4, CELL - 8, CELL - 8); c.beginPath(); c.moveTo(x + 4, y + 4); c.lineTo(x + CELL - 4, y + CELL - 4); c.moveTo(x + CELL - 4, y + 4); c.lineTo(x + 4, y + CELL - 4); c.stroke(); }
    else if (v === 5) { c.fillStyle = '#c9443b'; c.beginPath(); c.arc(x + 20, y + 20, 15, 0, 6.2832); c.fill(); c.strokeStyle = '#f0c24a'; c.lineWidth = 3; c.stroke(); c.fillStyle = '#f0c24a'; c.fillRect(x + 15, y + 13, 10, 14); c.fillStyle = '#c9443b'; c.fillRect(x + 18, y + 16, 4, 8); }

// фон
const amb = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, p: Math.random() * 6.28 }));
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  const T = TH[theme], game = phase === 'game', t = now / 1000;
  if (dirty) paint();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, cv.width, cv.height);
  shake *= Math.pow(.01, dt); if (shake < .2) shake = 0;
  ctx.setTransform(S, 0, 0, S, OX + (Math.random() - .5) * shake * S, OY + (Math.random() - .5) * shake * S);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

  if (game) ctx.drawImage(terr, 0, 0);
  else { ctx.fillStyle = T.fl; ctx.fillRect(0, 0, W, H); const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2); g.addColorStop(0, T.ac + '40'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }

      ctx.moveTo(x + 6, yy + Math.sin(ph) * 2); ctx.quadraticCurveTo(x + 20, yy + Math.sin(ph + 1.5) * 3 - 2, x + 34, yy + Math.sin(ph + 3) * 2);
    }

    lc.globalCompositeOperation = 'lighter';

    for (const f of fx) lt(f.x, f.y, f.r * 2.5, f.c, (1 - f.t / f.d) * .9);

      ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, yy, 12, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = c; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(['+', '»', '✦'][ty], x, yy + 5);
    }
    for (const [x, y, on] of mines) {
      ctx.fillStyle = '#2a2d38'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 6.2832); ctx.fill();
      ctx.fillStyle = on ? (Math.sin(t * 8) > 0 ? '#ff3b3b' : '#661a1a') : '#555'; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, 6.2832); ctx.fill();
    }
    // снаряды
    const el = Math.min(.08, (now - snapT) / 1000);
    for (const b of bullets) {
      const p = info.get(b.o), c = p ? COLORS[p.c] : '#fff', x = b.x + b.vx * el, y = b.y + b.vy * el;
      ctx.strokeStyle = c; ctx.globalAlpha = .45; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - b.vx * .03, y - b.vy * .03); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 6.2832); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 2, 0, 6.2832); ctx.fill();
    }

      const p = info.get(id); if (!p) continue;
      tk.x += (tk.tx - tk.x) * k; tk.y += (tk.ty - tk.y) * k;
      tk.a += Math.atan2(Math.sin(tk.ta - tk.a), Math.cos(tk.ta - tk.a)) * k;
      const mv = Math.hypot(tk.x - tk.px, tk.y - tk.py); tk.px = tk.x; tk.py = tk.y;
      if (mv > 1.2 && Math.random() < .5) pt.push({ x: tk.x, y: tk.y, vx: 0, vy: 0, l: .4, m: .4, c: (tk.fl & 2) ? '#40c4ff' : T.pc, s: 3 });
      if (tk.fl & 8) burst(tk.x, tk.y, 2, '#bfe8ff', 40, .3, 5);

      if (tk.fl & 4) { ctx.strokeStyle = '#ff5252'; ctx.globalAlpha = .5 + .3 * Math.sin(t * 20); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, R + 5, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1; }
      ctx.save(); ctx.rotate(tk.a); ctx.fillStyle = '#e9ecf5'; ctx.fillRect(0, -3, R + 11, 6); ctx.fillStyle = col; ctx.fillRect(R + 6, -3.5, 5, 7); ctx.restore();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(0, 0, R * .62, 0, 6.2832); ctx.fill();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, R * .38, 0, 6.2832); ctx.fill();
      if (id === me) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832); ctx.stroke(); }
      if (tk.fl & 1) { ctx.strokeStyle = '#6ee7ff'; ctx.globalAlpha = .65 + .25 * Math.sin(t * 14); ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, R + 8, 0, 6.2832); ctx.stroke(); ctx.fillStyle = '#6ee7ff22'; ctx.fill(); ctx.globalAlpha = 1; }
      const ratio = Math.max(0, Math.min(1, tk.hp / p.hp));
      ctx.fillStyle = '#000a'; ctx.fillRect(-17, -R - 14, 34, 6);
      ctx.fillStyle = ratio > .5 ? '#4caf50' : ratio > .25 ? '#ffc107' : '#f44336'; ctx.fillRect(-16, -R - 13, 32 * ratio, 4);
      ctx.fillStyle = '#e9ecf5'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(p.n, 0, -R - 19);
      ctx.restore();
    }
    // кусты полупрозрачные поверх танков
    ctx.fillStyle = T.bu; ctx.globalAlpha = .6;
    for (const [x, y] of bc) { const s = Math.sin(t * 1.4 + x * .1) * 1.5; ctx.beginPath(); ctx.arc(x - 8 + s, y + 3, 13, 0, 6.2832); ctx.arc(x + 8 - s, y + 3, 13, 0, 6.2832); ctx.arc(x, y - 7, 14, 0, 6.2832); ctx.fill(); }
    ctx.globalAlpha = .25; ctx.fillStyle = '#fff'; for (const [x, y] of bc) { ctx.beginPath(); ctx.arc(x - 4, y - 9, 5, 0, 6.2832); ctx.fill(); }
    ctx.globalAlpha = 1;
    // шторм
    if (zone[0] > 1) {
      ctx.fillStyle = 'rgba(255,30,70,.2)'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.rect(zone[0], zone[1], zone[2] - zone[0], zone[3] - zone[1]); ctx.fill('evenodd');
      ctx.strokeStyle = '#ff2d55'; ctx.globalAlpha = .6 + .3 * Math.sin(t * 5); ctx.lineWidth = 3; ctx.strokeRect(zone[0], zone[1], zone[2] - zone[0], zone[3] - zone[1]); ctx.globalAlpha = 1;
    }
  }

  // частицы и вспышки
  for (let i = pt.length - 1; i >= 0; i--) {
    const p = pt[i]; p.l -= dt; if (p.l <= 0) { pt.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .95; p.vy *= .95;
    ctx.globalAlpha = p.l / p.m; ctx.fillStyle = p.c; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);

  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt; if (f.t >= f.d) { fx.splice(i, 1); continue; }
    const q = f.t / f.d; ctx.globalAlpha = 1 - q; ctx.strokeStyle = f.c; ctx.lineWidth = 4 * (1 - q) + 1; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * q, 0, 6.2832); ctx.stroke();

  // ---- постобработка: bloom (двойное уменьшение), виньетка, скан-линии, зерно ----
  s1.drawImage(cv, OX, OY, W * S, H * S, 0, 0, 400, 220); s2.drawImage(sm1, 0, 0, 100, 55);
  ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .45; ctx.drawImage(sm1, 0, 0, W, H); ctx.globalAlpha = .55; ctx.drawImage(sm2, 0, 0, W, H);

  ctx.globalAlpha = .5; ctx.fillStyle = scPat; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .045; ctx.fillStyle = nzPat; ctx.save(); ctx.translate(Math.random() * 128, Math.random() * 128); ctx.fillRect(-128, -128, W + 256, H + 256); ctx.restore();

    if (cd > 0) { ctx.fillStyle = '#fff'; ctx.font = 'bold 130px sans-serif'; ctx.textAlign = 'center'; ctx.shadowColor = T.ac; ctx.shadowBlur = 30; ctx.fillText(Math.ceil(cd), W / 2, H / 2 + 45); ctx.shadowBlur = 0; }
    if (flash > 0) { ctx.fillStyle = 'rgba(255,60,60,' + flash * .35 + ')'; ctx.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 1.5); }
    if (!dead.has(me) && info.has(me)) { // прицел
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(mx, my, 11, 0, 6.2832); ctx.moveTo(mx - 17, my); ctx.lineTo(mx - 6, my); ctx.moveTo(mx + 6, my); ctx.lineTo(mx + 17, my); ctx.moveTo(mx, my - 17); ctx.lineTo(mx, my - 6); ctx.moveTo(mx, my + 6); ctx.lineTo(mx, my + 17); ctx.stroke(); ctx.globalAlpha = 1;
    }

    if (me_t && !dead.has(me) && cd <= 0) {
      const ang = Math.atan2(my - me_t.y, mx - me_t.x), mk2 = km | mm;
      if ((mk2 !== lastK || Math.abs(Math.atan2(Math.sin(ang - lastA), Math.cos(ang - lastA))) > .03) && now - lastS > 33) { tx({ t: 'in', k: mk2, a: +ang.toFixed(3) }); lastK = mk2; lastA = ang; lastS = now; }
    }

}
requestAnimationFrame(frame);
